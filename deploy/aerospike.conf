service {
    cluster-name nse-local
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        access-address 127.0.0.1
    }

    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }

    fabric {
        address any
        port 3001
    }
}

namespace nse {
    replication-factor 1
    default-ttl 0
    nsup-period 120
    max-record-size 2M

    storage-engine device {
        file /opt/aerospike/data/nse.dat
        filesize 1G
    }
}
